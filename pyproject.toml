[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "sciml-cylinder-pinn"
version = "0.1.0"
description = "Reproducible continuous-time PINN experiments for the cylinder wake inverse problem"
requires-python = ">=3.10"
dependencies = ["numpy>=1.24", "scipy>=1.10", "torch>=2.5", "matplotlib>=3.7"]

[project.scripts]
sciml = "sciml.cli:main"

[tool.setuptools.packages.find]
include = ["sciml*"]
